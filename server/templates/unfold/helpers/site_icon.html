{% load i18n %}

<a href="{% url 'admin:index' %}" class="flex items-center gap-2.5 text-inherit no-underline">
    {% if site_icon %}
        <img src="{{ site_icon }}" class="h-8 w-auto flex-shrink-0" alt="Logo" />
    {% elif site_logo %}
        <img src="{{ site_logo }}" class="h-8 w-auto flex-shrink-0" alt="Logo" />
    {% endif %}
    <span class="font-bold text-base text-font-important-light dark:text-font-important-dark whitespace-nowrap">
        {{ site_header|default:branding|default:site_title }}
    </span>
</a>
