name: Scheduled TaiwanJobs Batch Sync

# 每天定時自動同步台灣就業通最新期別資訊
on:
  schedule:
    # 台灣時間 08:00 (UTC 00:00)
    - cron: '0 0 * * *'
    # 台灣時間 17:00 (UTC 09:00)
    - cron: '0 9 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁 Actions 介面手動隨時觸發測試

concurrency:
  group: 'taiwanjobs-sync'
  cancel-in-progress: true

jobs:
  sync-batches:
    name: Sync Course Batches
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Print Sync Start Info
        run: |
          echo "========================================================"
          echo "🚀 啟動台灣就業通前端課程期別自動同步作業"
          echo "⏰ 執行時間: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================================"

      - name: Trigger Remote Backend Sync Endpoint
        run: |
          BASE_URL="${{ secrets.RENDER_API_BASE_URL }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://wdaweb.onrender.com"
          fi

          TOKEN="${{ secrets.CRON_SECRET_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="wdaweb-cron-sync-token-2026"
          fi

          TARGET_URL="${BASE_URL%/}/api/v1/cron/batches/sync"
          echo "📡 目標 API: $TARGET_URL"

          # 發送 POST 請求並等待伺服器回應（支援 Render 冷啟動等待最長 180s）
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$TARGET_URL" \
            -H "X-Cron-Token: $TOKEN" \
            -H "Content-Type: application/json" \
            --retry 3 \
            --retry-delay 15 \
            --max-time 180)

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          echo "--------------------------------------------------------"
          echo "HTTP 狀態碼: $HTTP_CODE"
          echo "伺服器回應: $HTTP_BODY"
          echo "--------------------------------------------------------"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "🎉 恭喜！台灣就業通最新期別同步成功！"
          else
            echo "❌ 同步未成功（狀態碼: $HTTP_CODE），請檢查後端日誌或密鑰設定。"
            exit 1
          fi
